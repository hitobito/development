name: Docker

on:
  push:
    # Publish `main` as Docker `latest` image.
    branches:
      - main

  # Automatically rebuild latest tag
  schedule:
    - cron: "7 23 * * *"

jobs:
  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: rails
            context: ./docker/rails
          - image: mailcatcher
            context: ./docker/mailcatcher
          # Toolchain base image for the rails image, built from the `base`
          # stage of the core hitobito Dockerfile via remote git context
          - image: hitobito-base
            context: https://github.com/hitobito/hitobito.git#master
            target: base

    steps:
      - uses: actions/checkout@v2

      - name: Build images
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker build ${TARGET:+--target $TARGET} ${{ matrix.context }} --tag ${{ matrix.image }}

      - name: Log into registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push images
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/${{ matrix.image }}
          
          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # Use Docker `latest` tag convention
          VERSION=latest

          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION

          docker tag ${{ matrix.image }} $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
